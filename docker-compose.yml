version: '3.9'

services:
  postgres:
    image: postgres:16
    container_name: co-lending-postgres
    environment:
      POSTGRES_DB: controltower
      POSTGRES_USER: controltower
      POSTGRES_PASSWORD: controltower
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U controltower -d controltower"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
